name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev gcc-mingw-w64-x86-64 zip

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build Linux application
        run: wails build -tags webkit2_41

      - name: Package AppImage
        run: |
          mkdir -p /tmp/appimagetool
          cd /tmp/appimagetool
          curl -fsSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract >/dev/null

          cd "$GITHUB_WORKSPACE"
          cp build/bin/stockbook build/appimage/Stockbook.AppDir/usr/bin/stockbook
          cd build/appimage
          ARCH=x86_64 /tmp/appimagetool/squashfs-root/AppRun \
            Stockbook.AppDir Stockbook-x86_64.AppImage

      - name: Build Windows application
        run: wails build -platform windows/amd64

      - name: Collect release assets
        run: |
          mkdir -p build/release
          cp build/appimage/Stockbook-x86_64.AppImage build/release/
          cp build/bin/stockbook.exe build/release/
          cd build/release
          zip -q -9 Stockbook-windows-amd64.zip stockbook.exe
          sha256sum \
            Stockbook-x86_64.AppImage \
            stockbook.exe \
            Stockbook-windows-amd64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Stockbook ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: |
            build/release/Stockbook-x86_64.AppImage
            build/release/stockbook.exe
            build/release/Stockbook-windows-amd64.zip
            build/release/SHA256SUMS.txt
